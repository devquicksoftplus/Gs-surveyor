<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECC880"/>
      <stop offset="50%" stop-color="#D7B56D"/>
      <stop offset="100%" stop-color="#B89243"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102D50"/>
      <stop offset="100%" stop-color="#091B30"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#navyGrad)"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="4 2"/>
  <circle cx="50" cy="50" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
  <!-- Crosshairs -->
  <line x1="50" y1="12" x2="50" y2="22" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="50" y1="78" x2="50" y2="88" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="12" y1="50" x2="22" y2="50" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="78" y1="50" x2="88" y2="50" stroke="url(#goldGrad)" stroke-width="2"/>
  <!-- Center GS Text -->
  <text x="50" y="58" font-family="'Outfit', 'Inter', sans-serif" font-size="26" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">GS</text>
</svg>